seed: 42

prompt_version: v1

environment:
  type: gridworld
  inventory:
    num_products: 3
    holding_cost: 0.5
    stockout_cost: 10.0
    lead_time: 2
    demand_mean: [10, 20, 15]
    demand_std: [2, 5, 3]
    max_steps: 50
    max_order: 40
    demand_distribution: normal
    service_level_target: 0.9

generalization:
  train_scenarios: [0, 1, 2, 3]
  test_scenarios: [4, 5]
  max_steps: 30
  train_steps_per_scenario: 20

gridworld:
  state_dim: 2
  action_dim: 2
  grid_size: 10
  noise_std: 0.1
  goal: [8.0, 8.0]
  goal_tolerance: 0.5
  max_steps: 50
  obstacles:
    - [3, 3]
    - [3, 4]
    - [4, 3]
    - [5, 5]
    - [6, 5]
    - [5, 6]

encoder:
  latent_dim: 16
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1

predictor:
  predictor_type: mlp
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  use_attention: true
  linear_attention_dim_head: 16
  linear_attention_heads: 4
  feature_map: elu+1

planner:
  horizon: 5
  num_samples: 20
  learning_rate: 0.01
  num_iterations: 20

active_learning:
  num_rounds: 5
  pool_size: 16
  query_batch_size: 4
  mc_samples: 5
  train_steps_per_round: 3
  input_dim: 2
  action_dim: 2
  human_in_loop: false
  use_mock_human: true

ab_testing:
  enabled: true
  models:
    default: "models/jepa_model.pth"
    candidate: "models/jepa_model_v2.pth"

visualization:
  enabled: false
  output_dir: ./outputs
  save_plots: false
  show_plots: false

logging:
  level: INFO

eval:
  episodes: 5
  train_steps_per_episode: 10

memory:
  use_context_compression: true
  history_length: 8
  gru_hidden_dim: 64
  gru_num_layers: 1
  compress_source: observation

mcp:
  enabled: true
  tools:
    n8n:
      enabled: false
      url: ""
    penpot:
      enabled: false
      url: ""
    appflowy:
      enabled: false
      url: ""
    plausible:
      enabled: false
      url: ""
