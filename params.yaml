seed: 42

gridworld:
  state_dim: 2
  action_dim: 2
  grid_size: 10
  noise_std: 0.1
  goal: [8.0, 8.0]
  goal_tolerance: 0.5
  max_steps: 50
  obstacles:
    - [3, 3]
    - [3, 4]
    - [4, 3]
    - [5, 5]
    - [6, 5]
    - [5, 6]

encoder:
  latent_dim: 16
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1

predictor:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  use_attention: true

planner:
  horizon: 5
  num_samples: 20
  learning_rate: 0.01
  num_iterations: 20

active_learning:
  num_rounds: 5
  pool_size: 16
  query_batch_size: 4
  mc_samples: 5
  train_steps_per_round: 3
  input_dim: 2
  action_dim: 2
  human_in_loop: true
  label_timeout_seconds: 3600

tools:
  weather:
    enabled: true
    api_url: "https://api.open-meteo.com/v1/forecast"

visualization:
  enabled: false
  output_dir: ./outputs
  save_plots: false
  show_plots: false

logging:
  level: INFO

eval:
  episodes: 5
  train_steps_per_episode: 10

memory:
  use_context_compression: true
  history_length: 8
  gru_hidden_dim: 64
  gru_num_layers: 1
  compress_source: observation
