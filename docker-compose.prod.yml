name: luthor-prod

x-luthor-env: &luthor-env
  LUTHOR_POSTGRES_URL: postgresql://${POSTGRES_USER:-luthor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-luthor}
  LUTHOR_CHROMA_HOST: chromadb
  LUTHOR_CHROMA_PORT: "8000"
  LUTHOR_MCP_ENABLED: "true"
  N8N_API_URL: http://n8n:5678
  N8N_API_KEY: ${N8N_API_KEY}
  PLAUSIBLE_API_URL: http://plausible:8000
  PLAUSIBLE_SITE_ID: ${PLAUSIBLE_SITE_ID}
  PLAUSIBLE_TOKEN: ${PLAUSIBLE_TOKEN}
  FOOOCUS_API_URL: http://fooocus:8888
  FOOOCUS_API_KEY: ${FOOOCUS_API_KEY:-}
  CALCOM_API_URL: http://calcom:3000
  CALCOM_API_KEY: ${CALCOM_API_KEY}
  CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}
  WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-tiny}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_letsencrypt:/letsencrypt
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=luthor_public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    networks:
      - luthor_public

  luthor-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_URL: https://${LUTHOR_DOMAIN}
        VITE_GRAFANA_URL: https://grafana.${LUTHOR_DOMAIN}
        VITE_EXPORT_TOKEN: ${LUTHOR_EXPORT_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - luthor_public
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-ui.rule=Host(`app.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-ui.entrypoints=websecure
      - traefik.http.routers.luthor-ui.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-ui.loadbalancer.server.port=80

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      <<: *luthor-env
    volumes:
      - demo_outputs:/app/demo_outputs
      - ytdlp_downloads:/app/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - luthor_public
      - luthor_internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-api.rule=Host(`${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-api.entrypoints=websecure
      - traefik.http.routers.luthor-api.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-api.loadbalancer.server.port=8080

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luthor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-luthor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/init-prod.sql:/docker-entrypoint-initdb.d/02-init-prod.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luthor} -d ${POSTGRES_DB:-luthor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - luthor_internal

  chromadb:
    image: chromadb/chroma:0.5.5
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - luthor_internal

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - api
    networks:
      - luthor_internal
      - luthor_public
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-prometheus.rule=Host(`prometheus.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-prometheus.entrypoints=websecure
      - traefik.http.routers.luthor-prometheus.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${LUTHOR_DOMAIN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - luthor_internal
      - luthor_public
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-grafana.rule=Host(`grafana.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-grafana.entrypoints=websecure
      - traefik.http.routers.luthor-grafana.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-grafana.loadbalancer.server.port=3000

  n8n:
    image: n8nio/n8n:1.64.0
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.${LUTHOR_DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${LUTHOR_DOMAIN}/
      GENERIC_TIMEZONE: Europe/Paris
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-luthor}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - luthor_internal
      - luthor_public
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-n8n.rule=Host(`n8n.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-n8n.entrypoints=websecure
      - traefik.http.routers.luthor-n8n.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-n8n.loadbalancer.server.port=5678

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - luthor_internal

  plausible:
    image: plausible/analytics:v2.1.4
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      BASE_URL: https://plausible.${LUTHOR_DOMAIN}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE}
      DATABASE_URL: postgresql://${POSTGRES_USER:-luthor}:${POSTGRES_PASSWORD}@postgres:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events
      DISABLE_REGISTRATION: "true"
    depends_on:
      - postgres
      - clickhouse
    networks:
      - luthor_internal
      - luthor_public
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-plausible.rule=Host(`plausible.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-plausible.entrypoints=websecure
      - traefik.http.routers.luthor-plausible.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-plausible.loadbalancer.server.port=8000

  calcom:
    image: calcom/cal.com:v4.6.18
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-luthor}:${POSTGRES_PASSWORD}@postgres:5432/calcom
      NEXTAUTH_SECRET: ${CALCOM_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALCOM_ENCRYPTION_KEY}
      NEXT_PUBLIC_WEBAPP_URL: https://cal.${LUTHOR_DOMAIN}
      NEXT_PUBLIC_API_V2_URL: https://cal.${LUTHOR_DOMAIN}/api/v2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - luthor_internal
      - luthor_public
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-calcom.rule=Host(`cal.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-calcom.entrypoints=websecure
      - traefik.http.routers.luthor-calcom.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-calcom.loadbalancer.server.port=3000

  fooocus:
    image: konieshadow/fooocus-api:0.5.0.1
    restart: unless-stopped
    environment:
      FOOOCUS_PORT: "8888"
    volumes:
      - fooocus_outputs:/app/outputs
    networks:
      - luthor_internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.luthor-fooocus.rule=Host(`fooocus.${LUTHOR_DOMAIN}`)
      - traefik.http.routers.luthor-fooocus.entrypoints=websecure
      - traefik.http.routers.luthor-fooocus.tls.certresolver=letsencrypt
      - traefik.http.services.luthor-fooocus.loadbalancer.server.port=8888

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_INCLUDE_STOPPED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - luthor_internal

networks:
  luthor_public:
    name: luthor_public
  luthor_internal:
    name: luthor_internal

volumes:
  postgres_data:
  chroma_data:
  prometheus_data:
  grafana_data:
  n8n_data:
  clickhouse_data:
  fooocus_outputs:
  demo_outputs:
  ytdlp_downloads:
  traefik_letsencrypt:
